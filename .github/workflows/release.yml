# ref: https://github.com/actions/runner-images
name: Release

on:
  push:
    branches:
      - rc
      - mizux/rc
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Stage and publish NuGet packages via OSS Exit Gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref_name}}
  cancel-in-progress: true

env:
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '21'
  # Disable auth (and caching) when running from a fork.
  # By default, secrets are not passed to workflows triggered from forks, including Dependabot.
  USE_GOOGLE_CLOUD_STORAGE: ${{! (github.event.pull_request.head.repo.fork || false)}}
  ORTOOLS_TOKEN: ${{secrets.ORTOOLS_TOKEN}}
  OR_TOOLS_PATCH: 0
jobs:
###############################################################################
# Build Native Delivery
  native_delivery:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { runner: "ubuntu-22.04",     arch: "amd64", os: "linux" },
          { runner: "ubuntu-22.04-arm", arch: "arm64", os: "linux" },
          { runner: "macos-15-intel",   arch: "amd64", os: "macos" },
          { runner: "macos-latest",     arch: "arm64", os: "macos" },
          { runner: "windows-latest",   arch: "amd64", os: "windows" }
        ]
        target: [
          { name: "cpp",       lang: "cpp",    version: "20" },
          { name: "dotnet",    lang: "dotnet", version: "8.0.x" },
          { name: "java",      lang: "java",   version: "21" },
        ]
    name: Build(${{matrix.platform.arch}}•${{matrix.platform.os}}•${{matrix.target.name}})
    runs-on: ${{matrix.platform.runner}}
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/remote_cache
      with:
        credentials_json: '${{secrets.GCP_BUCKET_API_KEY}}'
        set_cmake_sccache_launcher: true
    - uses: ./.github/actions/setup
      with:
        arch: ${{matrix.platform.arch}}
        os: ${{matrix.platform.os}}
        lang: ${{matrix.target.lang}}
        version: ${{matrix.target.version}}
    - name: Build Unix ${{matrix.target.name}} Delivery
      if: ${{matrix.platform.os == 'linux' || matrix.platform.os == 'macos'}}
      run: ./tools/release/build_delivery_unix.sh ${{matrix.target.lang}} ${{matrix.target.version}}
    - name: Build Windows ${{matrix.target.name}} Delivery
      if: ${{matrix.platform.os == 'windows'}}
      run: ./tools/release/build_delivery_windows.cmd ${{matrix.target.lang}} ${{matrix.target.version}}
    - name: Check export dir
      run: ls -R export
    - name: Upload Tarball Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ortools-${{matrix.platform.arch}}-${{matrix.platform.os}}-${{matrix.target.name}}
        path: |
          build.log
          export/*.tar.gz
          export/*.zip
          export/*.nupkg
          export/*.jar
          export/*.whl
        if-no-files-found: error
        retention-days: 1

###############################################################################
# Test Delivery
  test_native_delivery:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { runner: "ubuntu-22.04",     arch: "amd64", os: "linux" },
          { runner: "ubuntu-22.04-arm", arch: "arm64", os: "linux" },
          { runner: "macos-15-intel",   arch: "amd64", os: "macos" },
          { runner: "macos-latest",     arch: "arm64", os: "macos" },
          { runner: "windows-latest",   arch: "amd64", os: "windows" }
        ]
        target: [
          { name: "cpp",       lang: "cpp",    version: "20" },
          { name: "dotnet",    lang: "dotnet", version: "8.0.x" },
          { name: "java",      lang: "java",   version: "21" },
        ]
    name: Test(${{matrix.platform.arch}}•${{matrix.platform.os}}•${{matrix.target.name}})
    runs-on: ${{matrix.platform.runner}}
    needs: native_delivery
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        arch: ${{matrix.platform.arch}}
        os: ${{matrix.platform.os}}
        lang: ${{matrix.target.lang}}
        version: ${{matrix.target.version}}
    - name: Download Tarball Artifact
      uses: actions/download-artifact@v8
      with:
        name: ortools-${{matrix.platform.arch}}-${{matrix.platform.os}}-${{matrix.target.name}}
        path: .
    - name: Check export dir
      run: ls -R export
    - name: Test Unix ${{matrix.target.name}} Delivery
      if: ${{matrix.platform.os == 'linux' || matrix.platform.os == 'macos'}}
      run: ./tools/release/test_delivery_unix.sh ${{matrix.target.lang}} ${{matrix.target.version}}
    - name: Test Windows ${{matrix.target.name}} Delivery
      if: ${{matrix.platform.os == 'windows'}}
      run: ./tools/release/test_delivery_windows.cmd ${{matrix.target.lang}} ${{matrix.target.version}}

###############################################################################
# Build Meta Delivery
  meta_delivery:
    strategy:
      fail-fast: false
      matrix:
        target: [
          { name: "dotnet", lang: "dotnet", version: "8.0.x" },
          { name: "java",   lang: "java",   version: "21" }
        ]
    name: Build(meta•${{matrix.target.name}})
    runs-on: ubuntu-22.04
    needs: native_delivery
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/remote_cache
      with:
        credentials_json: '${{secrets.GCP_BUCKET_API_KEY}}'
        set_cmake_sccache_launcher: true
    - uses: ./.github/actions/setup
      with:
        arch: amd64
        os: linux
        lang: ${{matrix.target.lang}}
        version: ${{matrix.target.version}}
    - name: Download Native Artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: "ortools-*-*-${{matrix.target.name}}"
        merge-multiple: true
        path: .
    - name: Check Export dir
      run: ls -R export
    - name: Build ${{matrix.target.name}} Meta Delivery
      run: ./tools/release/build_delivery_meta.sh ${{matrix.target.lang}}
    - name: Check export_meta
      run: ls -R export_meta
    - name: Upload Meta Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ortools-meta-${{matrix.target.name}}
        path: |
          build.log
          export_meta/*.nupkg
          export_meta/*.snupkg
          export_meta/*.zip
          export_meta/*.jar
          export_meta/*.asc
        if-no-files-found: error
        retention-days: 1

###############################################################################
# Test Meta Delivery
  test_meta:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { runner: "ubuntu-22.04",     arch: "amd64", os: "linux" },
          { runner: "ubuntu-22.04-arm", arch: "arm64", os: "linux" },
          { runner: "macos-15-intel",   arch: "amd64", os: "macos" },
          { runner: "macos-latest",     arch: "arm64", os: "macos" },
          { runner: "windows-latest",   arch: "amd64", os: "windows" }
        ]
        target: [
          { name: "dotnet", lang: "dotnet", version: "8.0.x" },
          { name: "java",   lang: "java",   version: "21" }
        ]
    name: Test(${{matrix.platform.arch}}•${{matrix.platform.os}}•meta•${{matrix.target.name}})
    runs-on: ${{matrix.platform.runner}}
    needs: meta_delivery
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        arch: ${{matrix.platform.arch}}
        os: ${{matrix.platform.os}}
        lang: ${{matrix.target.lang}}
        version: ${{matrix.target.version}}
    - name: Download Native Artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: "ortools-*-*-${{matrix.target.name}}"
        merge-multiple: true
        path: .
    - name: Download Meta Artifact
      uses: actions/download-artifact@v8
      with:
        name: ortools-meta-${{matrix.target.name}}
        path: .
    - name: Copy Meta Artifact to export
      shell: bash
      run: cp -f export_meta/* export/
    - name: Check Export dir
      run: ls -R export
    - name: Test Unix ${{matrix.target.name}} Meta Delivery
      if: ${{matrix.platform.os == 'linux' || matrix.platform.os == 'macos'}}
      run: ./tools/release/test_delivery_unix.sh ${{matrix.target.lang}}
    - name: Test Windows ${{matrix.target.name}} Meta Delivery
      if: ${{matrix.platform.os == 'windows'}}
      run: ./tools/release/test_delivery_windows.cmd ${{matrix.target.lang}}

###############################################################################
# Publish NuGet Delivery via OSS Exit Gate
  publish_nuget:
    name: Publish(NuGet•OSS Exit Gate)
    runs-on: ubuntu-22.04
    needs: [test_native_delivery, test_meta]
    if: >-
      github.repository_owner == 'google' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_nuget) ||
       startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Download Native Dotnet Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: "ortools-*-*-dotnet"
        merge-multiple: true
        path: .
    - name: Download Meta Dotnet Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ortools-meta-dotnet
        path: .
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: Clean up stale releases from staging repo
      shell: bash
      run: |
        packages=$(gcloud artifacts packages list \
          --project="oss-exit-gate-prod" \
          --location="us" \
          --repository="or-tools--nuget" \
          --format="value(name)" 2>/dev/null || true)
        if [ -n "${packages}" ]; then
          echo "${packages}" | xargs -r -I {} sh -c '
            package_name=$(basename "{}")
            echo "Deleting package: $package_name..."
            gcloud artifacts packages delete "{}" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="or-tools--nuget" \
              --quiet
          '
        fi
    - name: Stage NuGet packages and upload OSS Exit Gate manifest
      shell: bash
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import glob
        import json
        import subprocess
        import xml.etree.ElementTree as ET
        import zipfile

        nupkgs = sorted(set(glob.glob("export/*.nupkg") + glob.glob("export_meta/*.nupkg")))
        nupkgs = [p for p in nupkgs if not p.endswith(".symbols.nupkg")]
        if not nupkgs:
            raise SystemExit("No .nupkg artifacts found in export/ or export_meta/.")

        for nupkg in nupkgs:
            with zipfile.ZipFile(nupkg, "r") as zf:
                nuspecs = [n for n in zf.namelist() if n.endswith(".nuspec") and "/" not in n]
                if not nuspecs:
                    raise SystemExit(f"No root .nuspec found inside {nupkg}")
                root = ET.fromstring(zf.read(nuspecs[0]))
            pkg_id = None
            version = None
            for section in root:
                if section.tag.split("}")[-1] == "metadata":
                    for child in section:
                        tag = child.tag.split("}")[-1]
                        if tag == "id" and child.text:
                            pkg_id = child.text.strip().lower()
                        elif tag == "version" and child.text:
                            version = child.text.strip()
            if not pkg_id or not version:
                raise SystemExit(f"Failed to parse package id/version from {nupkg}")

            print(f"Uploading {nupkg} -> package={pkg_id} version={version}")
            subprocess.run(
                [
                    "gcloud",
                    "artifacts",
                    "generic",
                    "upload",
                    "--project=oss-exit-gate-prod",
                    "--location=us",
                    "--repository=or-tools--nuget",
                    f"--package={pkg_id}",
                    f"--version={version}",
                    f"--source={nupkg}",
                ],
                check=True,
            )

        with open("manifest.json", "w", encoding="utf-8") as fh:
            json.dump({"publish_all": True}, fh)
            fh.write("\n")
        PY

        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/or-tools/nuget/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"

###############################################################################
# DOCKER ARCHIVES
  distro_archives:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
        os: [
          almalinux-10,
          alpine-edge,
          archlinux,
          debian-sid,
          debian-13,
          debian-12,
          fedora-44,
          fedora-43,
          opensuse-leap,
          rockylinux-10,
          ubuntu-26.04,
          ubuntu-24.04,
          ubuntu-22.04,
        ]
        lang: [cpp, dotnet, java, python]
        exclude:
          # debian-12 only provide openjdk 17
          - os: debian-12
            lang: java
    name: Distro(${{matrix.arch}}•${{matrix.os}}•${{matrix.lang}})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: retrieve or-tools.snk
      run: >
        openssl aes-256-cbc -iter 42 -pass pass:"$ORTOOLS_TOKEN"
        -in "tools/release/or-tools.snk.enc"
        -out "tools/docker/or-tools.snk" -d
    - name: Build ${{matrix.lang}}
      run: make --directory=tools/docker ${{matrix.arch}}_${{matrix.os}}_${{matrix.lang}}_build
    - name: Export ${{matrix.lang}}
      run: make --directory=tools/docker ${{matrix.arch}}_${{matrix.os}}_${{matrix.lang}}_export
    - name: Test ${{matrix.lang}} export
      run: make --directory=tools/docker ${{matrix.arch}}_${{matrix.os}}_${{matrix.lang}}_test
    - name: Check Export dir
      run: ls -R tools/docker/export
    - name: Upload Tarball Artifact
      uses: actions/upload-artifact@v7
      with:
        path: |
          tools/docker/export/archives/*.tar.gz
        archive: false
        if-no-files-found: error
        retention-days: 1

###############################################################################
# Pythons
## Python Manylinux
  python_manylinux:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64] # arm64
        distro: [manylinux, musllinux]
        python: [
          310,
          311,
          312,
          313,
          314,
          315,
        ]
    name: Python(${{matrix.arch}}•${{matrix.distro}}•cp${{matrix.python}})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build Whl
      run: >
        make --directory=tools/docker
        python_${{matrix.arch}}_${{matrix.distro}}_cp${{matrix.python}}_build
    - name: Export Whl
      run: >
        make --directory=tools/docker
        python_${{matrix.arch}}_${{matrix.distro}}_cp${{matrix.python}}_export
    - name: Check Export dir
      run: ls -R tools/docker/export
    - name: Upload Tarball Artifact
      uses: actions/upload-artifact@v7
      with:
        path: |
          tools/docker/export/python/ortools-*${{matrix.distro}}*.whl
        archive: false
        if-no-files-found: error
        retention-days: 1

##  Python MacOS & Windows
  python_mac_win:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { runner: "macos-15-intel",   arch: "amd64", os: "macos" },
          { runner: "macos-latest",     arch: "arm64", os: "macos" },
          { runner: "windows-latest",   arch: "amd64", os: "windows" }
        ]
        target: [
          { name: "python310", lang: "python", version: "10" },
          { name: "python311", lang: "python", version: "11" },
          { name: "python312", lang: "python", version: "12" },
          { name: "python313", lang: "python", version: "13" },
          { name: "python314", lang: "python", version: "14" }
        ]
        exclude:
          # setup/python do not provide python 3.10 alias
          - platform: {os: macos, arch: amd64 }
            target: {lang: python, version: 10 }
    name: Build(${{matrix.platform.arch}}•${{matrix.platform.os}}•${{matrix.target.name}})
    runs-on: ${{matrix.platform.runner}}
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/remote_cache
      with:
        credentials_json: '${{secrets.GCP_BUCKET_API_KEY}}'
        set_cmake_sccache_launcher: true
    - uses: ./.github/actions/setup
      with:
        arch: ${{matrix.platform.arch}}
        os: ${{matrix.platform.os}}
        lang: ${{matrix.target.lang}}
        version: ${{matrix.target.version}}
    - name: Build Unix ${{matrix.target.name}} Delivery
      if: ${{matrix.platform.os == 'linux' || matrix.platform.os == 'macos'}}
      run: ./tools/release/build_delivery_unix.sh ${{matrix.target.lang}} ${{matrix.target.version}}
    - name: Build Windows ${{matrix.target.name}} Delivery
      if: ${{matrix.platform.os == 'windows'}}
      run: ./tools/release/build_delivery_windows.cmd ${{matrix.target.lang}} ${{matrix.target.version}}
    - name: Check export dir
      run: ls -R export
    - name: Upload Tarball Artifact
      uses: actions/upload-artifact@v7
      with:
        path: |
          export/*.whl
        archive: false
        if-no-files-found: error
        retention-days: 1

## Test Python MacOS & Windows
  test_python_mac_win:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { runner: "macos-15-intel",   arch: "amd64", os: "macos",   py_os: "macosx", py_arch: "x86_64" },
          { runner: "macos-latest",     arch: "arm64", os: "macos",   py_os: "macosx", py_arch: "arm64" },
          { runner: "windows-latest",   arch: "amd64", os: "windows", py_os: "win",    py_arch: "amd64" }
        ]
        target: [
          { name: "python310", lang: "python", version: "10" },
          { name: "python311", lang: "python", version: "11" },
          { name: "python312", lang: "python", version: "12" },
          { name: "python313", lang: "python", version: "13" },
          { name: "python314", lang: "python", version: "14" }
        ]
        exclude:
          # setup/python do not provide python 3.10 alias
          - platform: {os: macos, arch: amd64 }
            target: {lang: python, version: 10 }
    name: Test(${{matrix.platform.arch}}•${{matrix.platform.os}}•${{matrix.target.name}})
    runs-on: ${{matrix.platform.runner}}
    needs: python_mac_win
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        arch: ${{matrix.platform.arch}}
        os: ${{matrix.platform.os}}
        lang: ${{matrix.target.lang}}
        version: ${{matrix.target.version}}
    - name: Download Tarball Artifact
      uses: actions/download-artifact@v8
      with:
        pattern: "ortools-*-cp3${{matrix.target.version}}-${{matrix.platform.py_os}}_*${{matrix.platform.py_arch}}.whl"
        path: export/
    - name: Check Export dir
      run: ls -R export
    - name: Test Unix ${{matrix.target.name}} Delivery
      if: ${{matrix.platform.os == 'linux' || matrix.platform.os == 'macos'}}
      run: ./tools/release/test_delivery_unix.sh ${{matrix.target.lang}} ${{matrix.target.version}}
    - name: Test Windows ${{matrix.target.name}} Delivery
      if: ${{matrix.platform.os == 'windows'}}
      run: ./tools/release/test_delivery_windows.cmd ${{matrix.target.lang}} ${{matrix.target.version}}
